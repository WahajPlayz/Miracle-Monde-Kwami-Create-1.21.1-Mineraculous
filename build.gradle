// ==============================================================================
// Addon-MDK Build Script
// This Gradle build script is configured for developing a NeoForge addon for
// Mineraculous using NeoForged's ModDevGradle (MDG).
// ==============================================================================

plugins {
	id 'java-library'
	id 'maven-publish'
	id 'signing'
	// Immaculate provides automated code formatting using Eclipse Formatter and Spotless.
	// Run './gradlew immaculateApply' to automatically format your code!
	id 'dev.lukebemish.immaculate' version '0.1.+'
	id 'idea'
	// ModDevGradle (MDG) is the official NeoForge Gradle plugin for mod development.
	id 'net.neoforged.moddev' version "${mdg_version}"
}

tasks.named('wrapper', Wrapper).configure {
	distributionType = Wrapper.DistributionType.BIN
}

// Sets the base archive name for the compiled jar file (e.g., exampleaddon-1.21.1)
base {
	archivesName = "${mod_id}-${minecraft_version}"
}

// Configure Java toolchain and generate sources/javadoc jars when building
java {
	toolchain.languageVersion = JavaLanguageVersion.of(java_version)
	withSourcesJar()
	withJavadocJar()
}

// ==============================================================================
// Repositories
// Declare where Gradle should look for dependencies (Mineraculous, TommyLib, etc.)
// ==============================================================================
repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter { includeGroupAndSubgroups "maven.modrinth" }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'JEI'
				url = 'https://maven.blamejared.com/'
			}
		}
		filter { includeGroupAndSubgroups "mezz.jei" }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'GeckoLib'
				url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
			}
		}
		filter {
			includeGroupAndSubgroups 'software.bernie.geckolib'
			includeGroupAndSubgroups 'com.eliotlash.mclib'
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'SmartBrainLib'
				url = "https://dl.cloudsmith.io/public/tslat/sbl/maven/"
			}
		}
		filter { includeGroupAndSubgroups 'net.tslat.smartbrainlib' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Curios'
				url = "https://maven.theillusivec4.top/"
			}
		}
		filter { includeGroupAndSubgroups 'top.theillusivec4.curios' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modonomicon'
				url = "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/"
			}
		}
		filter { includeGroupAndSubgroups "com.klikli_dev" }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Voice Chat API'
				url = 'https://maven.maxhenkel.de/repository/public'
			}
		}
		filter { includeGroupAndSubgroups "de.maxhenkel.voicechat" }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Sherds API'
				url = 'https://dl.cloudsmith.io/public/thomasglasser/sherdsapi/maven/'
			}
		}
		filter { includeGroupAndSubgroups "dev.thomasglasser.sherdsapi" }
	}
	maven {
		name = 'Mineraculous'
		url = 'https://dl.cloudsmith.io/public/thomasglasser/mineraculous/maven/'
		content {
			includeGroupAndSubgroups("dev.thomasglasser.mineraculous")
		}
	}
	maven {
		name = 'TommyLib'
		url = 'https://dl.cloudsmith.io/public/thomasglasser/tommylib/maven/'
		content {
			includeGroupAndSubgroups("dev.thomasglasser.tommylib")
		}
	}
	maven {
		name = 'NeoForge'
		url = 'https://maven.neoforged.net/releases'
	}
	maven {
		name = 'Mojang Meta'
		url = 'https://maven.neoforged.net/mojang-meta'
	}
	mavenCentral()
	mavenLocal()
}

// ==============================================================================
// NeoForge ModDevGradle Configuration
// ==============================================================================
neoForge {
	version = "${neoforge_version}"

	// Parchment mappings provide human-readable parameter names and javadocs
	parchment {
		minecraftVersion = parchment_minecraft_version
		mappingsVersion = parchment_version
	}

	// Define run configurations for testing your mod in the IDE
	runs {
		configureEach {
			systemProperties.put('terminal.ansi', 'true')
		}
		client {
			client()
			ideName = "Client"
			gameDirectory = project.layout.projectDirectory.dir('runs/client')
		}
		client_alt {
			client()
			ideName = "Client 2"
			gameDirectory = project.layout.projectDirectory.dir('runs/client_alt')
			programArguments.addAll "--username", "DevAlt"
		}
		client_alt_alt {
			client()
			ideName = "Client 3"
			gameDirectory = project.layout.projectDirectory.dir('runs/client_alt_alt')
			programArguments.addAll "--username", "DevAltAlt"
		}
		auth_client {
			client()
			ideName = "Auth Client"
			devLogin = true
			gameDirectory = project.layout.projectDirectory.dir('runs/auth_client')
		}
		server {
			server()
			ideName = "Server"
			gameDirectory = project.layout.projectDirectory.dir('runs/server')
		}
		// Data generation run config: generates assets and data into src/generated/resources/
		data {
			data()
			ideName = "Data Generation"
			gameDirectory = project.layout.projectDirectory.dir('runs/data')
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}
	}

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

// ==============================================================================
// Dependencies
// ==============================================================================
dependencies {
	// TommyLib is required by Mineraculous. Using jarJar bundles it if needed.
	jarJar implementation("dev.thomasglasser.tommylib:tommylib-neoforge-${minecraft_version}:${tommylib_version}")

	// Mineraculous API: provides core registries, capabilities, and base classes for addons.
	api "dev.thomasglasser.mineraculous:mineraculous-${minecraft_version}:${mineraculous_version}"

	// --- Optional & Integration Dependencies ---
	// Curios is required if your addon registers custom Miraculouses or wearable jewelry.
	implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"

	// Uncomment below if you need advanced entity/AI behaviors via SmartBrainLib:
	// implementation "net.tslat.smartbrainlib:smartbrainlib-neoforge-${minecraft_version}:${smartbrainlib_version}"

	// Uncomment below if you want to create in-game guide books via Modonomicon:
	// implementation "com.klikli_dev:modonomicon-${minecraft_version}-neoforge:${modonomicon_version}"

	// --- Development QoL Mods ---
	// Jade is included as Mineraculous language/data providers reference Jade tooltip APIs:
	implementation "maven.modrinth:jade:${jade_version}+neoforge"
	// localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// ==============================================================================
// Resource Processing & Mod Metadata Generation
// Processes src/main/templates/ (e.g. neoforge.mods.toml) replacing ${variables}
// with values from gradle.properties and build.gradle.
// ==============================================================================
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			version: project.version,
			group: project.group,
			minecraft_version: minecraft_version,
			next_minecraft_version: next_minecraft_version,
			mod_name: mod_name,
			mod_author: mod_author,
			mod_id: mod_id,
			license: license,
			description: project.description,
			neoforge_version: neoforge_version,
			major_fml_version: major_fml_version,
			java_version: java_version,
			icon: icon,
			tommylib_version: tommylib_version,
			mineraculous_version: mineraculous_version,
			curios_version: curios_version,
			smartbrainlib_version: smartbrainlib_version,
			modonomicon_version: modonomicon_version,
			jade_version: jade_version,
			jei_version: jei_version,
	]

	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
tasks.processResources.dependsOn generateModMetadata

// Include generated resources (from data generation) in the resource source directories
sourceSets.main.resources { srcDir 'src/generated/resources' }

// ==============================================================================
// Code Formatting (Immaculate & Spotless)
// Automatically formats Java code before compiling.
// ==============================================================================
compileJava.dependsOn immaculateApply
compileJava.finalizedBy immaculateCheck

immaculate {
	workflows.register('java') {
		java()
		files.from rootProject.fileTree("src", {
			include "**/*.java"
		})
		noTabs()
		googleFixImports()
		toggleOff = 'spotless:off'
		toggleOn = 'spotless:on'
		eclipse {
			version '3.37.0'
			config = rootProject.file('codeformat/formatter-config.xml')
		}

		// Disallow wildcard imports (e.g., import net.minecraft.world.item.*;)
		custom 'noWildcardImports', { String fileContents ->
			if (fileContents.contains('*;\n')) {
				throw new GradleException('No wildcard imports are allowed! Please import classes explicitly.')
			}
		}

		// Enforce using @Nullable instead of @NotNull or @Nonnull
		custom 'noNotNull', { String fileContents ->
			if (fileContents.contains('@NotNull') || fileContents.contains('@Nonnull')) {
				throw new GradleException('@NotNull and @Nonnull are disallowed. Use @Nullable where appropriate.')
			}
		}

		// Trim trailing whitespace from added lines
		def trailingWhitespace = java.util.regex.Pattern.compile('^\\+.*[ \t]+\$', java.util.regex.Pattern.UNIX_LINES | java.util.regex.Pattern.MULTILINE)
		custom 'trimTrailingWhitespace', { String fileContents ->
			java.util.regex.Matcher matcher = trailingWhitespace.matcher(fileContents)
			StringBuilder sb = new StringBuilder()
			while (matcher.find()) {
				matcher.appendReplacement(sb, matcher.group().trim())
			}
			matcher.appendTail(sb)
			return sb.toString()
		}

		custom 'jetbrainsNullable', { String fileContents ->
			fileContents.replace('javax.annotation.Nullable', 'org.jetbrains.annotations.Nullable')
		}
	}
}

javadoc {
	failOnError = false
}

// ==============================================================================
// Capability Declarations & Jar Manifest
// Read more about capabilities: https://docs.gradle.org/current/userguide/component_capabilities.html
// ==============================================================================
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
	configurations."$variant".outgoing {
		capability("$group:${base.archivesName.get()}:$version")
		capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
		capability("$group:$mod_id:$version")
	}
	publishing.publications.configureEach {
		suppressPomMetadataWarningsFor(variant)
	}
}

jar {
	manifest {
		attributes([
				'Specification-Title'   : mod_name,
				'Specification-Vendor'  : mod_author,
				'Specification-Version' : project.jar.archiveVersion,
				'Implementation-Title'  : project.name,
				'Implementation-Version': project.jar.archiveVersion,
				'Implementation-Vendor' : mod_author,
				'Built-On-Minecraft'    : minecraft_version
		])
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
